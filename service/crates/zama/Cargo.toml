[package]
name = "zz-zama"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
zz-core = { path = "../core" }
alloy = { version = "=1.8.3", features = ["eip712", "k256", "signer-local", "sol-types", "dyn-abi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
