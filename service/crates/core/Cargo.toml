[package]
name = "zz-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
serde_json = "1"
postgres = "0.19"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
