AWSTemplateFormatVersion: '2010-09-09'
Description: cwXMR Nitro parent and recipient-restricted KMS foundation. No resources are created by local tests.
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Operator-reviewed Amazon Linux 2023 x86_64 AMI in this region
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing egress-enabled group; expose only raw TCP after registry/TLS validation
  PolicyAdministratorArn:
    Type: String
    Description: Trusted KMS policy administrator role ARN; it can change recovery confidentiality policy
  RecoveryEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Keep false until the final measured image PCR tuple is reviewed
  Pcr0:
    Type: String
    AllowedPattern: '(?!0{96})[0-9a-fA-F]{96}'
  Pcr1:
    Type: String
    AllowedPattern: '(?!0{96})[0-9a-fA-F]{96}'
  Pcr2:
    Type: String
    AllowedPattern: '(?!0{96})[0-9a-fA-F]{96}'
Conditions:
  EnableRecipientRecovery: !Equals [!Ref RecoveryEnabled, 'true']
Resources:
  ParentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
  ParentProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ParentRole]
  RecoveryKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: cwXMR enclave-only data-key recovery; account policy administrators remain trusted
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Deliberately no root kms:* / IAM delegation wildcard statement.
          - Sid: TrustedPolicyAdministration
            Effect: Allow
            Principal: {AWS: !Ref PolicyAdministratorArn}
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:ListKeyPolicies
              - kms:EnableKey
              - kms:DisableKey
              - kms:EnableKeyRotation
              - kms:DisableKeyRotation
              - kms:GetKeyRotationStatus
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
            Resource: '*'
          - !If
            - EnableRecipientRecovery
            - Sid: OnlyApprovedAttestedRecipient
              Effect: Allow
              Principal: {AWS: !GetAtt ParentRole.Arn}
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: '*'
              Condition:
                StringEqualsIgnoreCase:
                  kms:RecipientAttestation:PCR0: !Ref Pcr0
                  kms:RecipientAttestation:PCR1: !Ref Pcr1
                  kms:RecipientAttestation:PCR2: !Ref Pcr2
                Bool: {aws:SecureTransport: 'true'}
            - !Ref AWS::NoValue
          - Sid: DenyParentPlaintextRecovery
            Effect: Deny
            Principal: {AWS: !GetAtt ParentRole.Arn}
            Action: [kms:Decrypt, kms:GenerateDataKey]
            Resource: '*'
            Condition:
              'Null': {kms:RecipientAttestation:ImageSha384: 'true'}
          - Sid: DenyParentChosenDataKeysAndDelegation
            Effect: Deny
            Principal: {AWS: !GetAtt ParentRole.Arn}
            Action:
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:GenerateDataKeyPair*
              - kms:CreateGrant
              - kms:PutKeyPolicy
            Resource: '*'
  Parent:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      # 8 vCPUs / 32 GiB leaves capacity for a 2 vCPU, 8 GiB enclave + parent.
      # This is a paid instance, NOT a free-tier recommendation or a measured SDK sizing result.
      InstanceType: m6i.2xlarge
      IamInstanceProfile: !Ref ParentProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroupId]
      EnclaveOptions: {Enabled: true}
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 40, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: cwxmr-nitro-parent}]
Outputs:
  InstanceId: {Value: !Ref Parent}
  RecoveryKeyArn: {Value: !GetAtt RecoveryKey.Arn}
  ParentRoleArn: {Value: !GetAtt ParentRole.Arn}
